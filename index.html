<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prodigy AI</title>
 
<style>
body{
background:#0f0f0f;
color:white;
font-family:Arial,sans-serif;
text-align:center;
margin:0;
padding:40px 20px;
}
 
.logo{
width:350px;
max-width:90%;
}
 
.tagline{
color:#d4af37;
font-size:22px;
margin-top:20px;
margin-bottom:30px;
}
 
.scanner{
display:none;
position:relative;
max-width:500px;
width:100%;
margin:20px auto;
overflow:hidden;
border-radius:12px;
}
 
.preview{
max-width:500px;
width:100%;
display:block;
border-radius:12px;
}
 
.scanner-overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.25);
pointer-events:none;
}
 
.scan-line{
position:absolute;
left:0;
width:100%;
height:4px;
background:#d4af37;
box-shadow:0 0 20px #d4af37;
animation:scan 2s linear infinite;
}
 
@keyframes scan{
0%{top:0;}
100%{top:100%;}
}
 
.scan-status{
position:absolute;
top:10px;
left:10px;
font-size:12px;
font-weight:bold;
letter-spacing:2px;
color:#d4af37;
background:rgba(0,0,0,.7);
padding:8px 10px;
border-radius:6px;
}
 
.scanner-corner{
position:absolute;
width:40px;
height:40px;
}
 
.tl{
top:10px;
left:10px;
border-top:3px solid #d4af37;
border-left:3px solid #d4af37;
}
 
.tr{
top:10px;
right:10px;
border-top:3px solid #d4af37;
border-right:3px solid #d4af37;
}
 
.bl{
bottom:10px;
left:10px;
border-bottom:3px solid #d4af37;
border-left:3px solid #d4af37;
}
 
.br{
bottom:10px;
right:10px;
border-bottom:3px solid #d4af37;
border-right:3px solid #d4af37;
}
 
.button{
background:#d4af37;
color:black;
border:none;
padding:12px 24px;
border-radius:6px;
font-weight:bold;
cursor:pointer;
}
 
.button:hover{
opacity:.9;
}
 
#status{
margin-top:20px;
color:#d4af37;
}
</style>
</head>
 
<body>
 
<img src="logo.png" alt="Prodigy Logo" class="logo">
 
<div class="tagline">
AI-Powered Morph Identification
</div>
 
<input type="file" id="photo" accept="image/*">
 
<br><br>
 
<div id="scanner" class="scanner">
 
<img id="preview" class="preview" alt="Preview">
 
<div class="scanner-overlay"></div>
 
<div class="scanner-corner tl"></div>
<div class="scanner-corner tr"></div>
<div class="scanner-corner bl"></div>
<div class="scanner-corner br"></div>
 
<div class="scan-line"></div>
 
<div class="scan-status">
PRODIGY AI<br>
SCAN READY
</div>
 
</div>
 
<br>
 
<button class="button" onclick="analyzeMorph()">
Analyze Morph
</button>
 
<div id="status"></div>
 
<script>
 
const input=document.getElementById('photo');
const preview=document.getElementById('preview');
 
input.addEventListener('change',function(e){
 
const file=e.target.files[0];
 
if(!file)return;
 
preview.src=URL.createObjectURL(file);
 
document.getElementById('scanner').style.display='block';
 
});
 
function analyzeMorph(){
 
const file=document.getElementById('photo').files[0];
 
if(!file){
alert('Please select an image first.');
return;
}
 
document.getElementById('status').innerHTML='Analyzing image...';
 
}
 
</script>
 
</body>
</html>
