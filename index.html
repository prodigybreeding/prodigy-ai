<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prodigy AI</title>
 
<style>
body{
background:#0f0f0f;
color:white;
font-family:Arial,sans-serif;
text-align:center;
margin:0;
padding:40px 20px;
}
 
.logo{
width:350px;
max-width:90%;
}
 
.tagline{
color:#d4af37;
font-size:22px;
margin-top:20px;
margin-bottom:30px;
}
 
.preview-wrapper{
display:none;
position:relative;
max-width:500px;
width:100%;
margin:20px auto;
}
 
.preview{
max-width:500px;
width:100%;
border-radius:12px;
display:block;
}
 
.scan-overlay{
position:absolute;
top:0;
left:0;
right:0;
bottom:0;
border:2px solid #d4af37;
border-radius:12px;
pointer-events:none;
overflow:hidden;
}
 
.scan-overlay::after{
content:"";
position:absolute;
left:0;
width:100%;
height:80px;
background:linear-gradient(
to bottom,
transparent,
rgba(212,175,55,.4),
transparent
);
animation:scan 2s linear infinite;
}
 
@keyframes scan{
0%{
top:-80px;
}
100%{
top:100%;
}
}
 
.button{
background:#d4af37;
color:black;
border:none;
padding:12px 24px;
border-radius:6px;
font-weight:bold;
cursor:pointer;
}
 
.button:hover{
opacity:.9;
}
 
#status{
margin-top:20px;
color:#d4af37;
}
</style>
</head>
 
<body>
 
<img src="logo.png" alt="Prodigy Logo" class="logo">
 
<div class="tagline">
AI-Powered Morph Identification
</div>
 
<input type="file" id="photo" accept="image/*">
 
<br><br>
 
<div id="previewWrapper" class="preview-wrapper">
<img id="preview" class="preview" alt="Preview">
<div class="scan-overlay"></div>
</div>
 
<br>
 
<button class="button" onclick="analyzeMorph()">
Analyze Morph
</button>
 
<div id="status"></div>
 
<script>
const input=document.getElementById('photo');
const preview=document.getElementById('preview');
 
input.addEventListener('change',function(e){
 
const file=e.target.files[0];
 
if(!file) return;
 
preview.src=URL.createObjectURL(file);
 
document.getElementById('previewWrapper').style.display='block';
});
 
function analyzeMorph(){
 
const file=document.getElementById('photo').files[0];
 
if(!file){
alert('Please select an image first.');
return;
}
 
document.getElementById('status').innerHTML='Analyzing image...';
 
}
</script>
 
</body>
</html>
