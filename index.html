<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prodigy AI</title>
 
<style>
body{
background:#0f0f0f;
color:white;
font-family:Arial,sans-serif;
text-align:center;
margin:0;
padding:40px 20px;
}
 
.logo{
width:350px;
max-width:90%;
}
 
.tagline{
color:#d4af37;
font-size:22px;
margin-top:20px;
margin-bottom:30px;
}
 
.button{
background:#d4af37;
color:black;
border:none;
padding:12px 24px;
border-radius:6px;
font-weight:bold;
cursor:pointer;
}
 
.button:hover{
opacity:.9;
}
 
#status{
margin-top:20px;
color:#d4af37;
font-weight:bold;
}
 
/* LENTE / SCANNER */
 
.scan-container{
display:none;
width:280px;
height:280px;
margin:30px auto;
border:4px solid #d4af37;
border-radius:50%;
overflow:hidden;
position:relative;
box-shadow:
0 0 15px rgba(212,175,55,.5),
0 0 40px rgba(212,175,55,.2);
}
 
.preview{
width:100%;
height:100%;
object-fit:cover;
display:block;
}
 
.scan-line{
position:absolute;
left:0;
width:100%;
height:100%;
background:linear-gradient(
to bottom,
transparent,
rgba(212,175,55,.35),
transparent
);
animation:scan 2s linear infinite;
}
 
@keyframes scan{
0%{
top:-100%;
}
100%{
top:100%;
}
}
 
.scanner-label{
display:none;
color:#d4af37;
letter-spacing:3px;
font-size:14px;
font-weight:bold;
margin-top:15px;
text-transform:uppercase;
}
</style>
</head>
 
<body>
 
<img src="logo.png" alt="Prodigy Logo" class="logo">
 
<div class="tagline">
AI-Powered Morph Identification
</div>
 
<input type="file" id="photo" accept="image/*">
 
<div id="scannerLabel" class="scanner-label">
AI SCAN READY
</div>
 
<div id="scanContainer" class="scan-container">
<img id="preview" class="preview" alt="Preview">
<div class="scan-line"></div>
</div>
 
<button class="button" onclick="analyzeMorph()">
Analyze Morph
</button>
 
<div id="status"></div>
 
<script>
 
const input = document.getElementById('photo');
const preview = document.getElementById('preview');
 
input.addEventListener('change', function(e){
 
const file = e.target.files[0];
 
if(!file) return;
 
preview.src = URL.createObjectURL(file);
 
document.getElementById('scanContainer').style.display = 'block';
document.getElementById('scannerLabel').style.display = 'block';
 
document.getElementById('status').innerHTML =
'Image loaded. Ready for analysis.';
});
 
function analyzeMorph(){
 
const file = document.getElementById('photo').files[0];
 
if(!file){
alert('Please select an image first.');
return;
}
 
document.getElementById('status').innerHTML =
'Scanning image...';
}
 
</script>
 
</body>
</html>
